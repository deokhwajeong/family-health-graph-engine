[project]
name = "family-health-graph-engine"
version = "0.3.0"
description = "Household health data modeled as a knowledge graph, with graph ML insights. Synthetic demo data only."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["frontend"]

[tool.ruff.lint]
# Correctness-focused rule set: pyflakes, pycodestyle errors, bugbear basics.
select = ["E4", "E7", "E9", "F", "B006", "B008"]
ignore = ["B008"]  # FastAPI's File()/Form() defaults are the intended pattern
