name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    - name: Run tests
      run: |
        pip install -r requirements-dev.txt
        ruff check backend tests
        pytest -q
    
    - name: Generate graph stats
      run: |
        python -c "
        from backend.app.synthetic_data import build_demo_family_household
        G = build_demo_family_household(num_days=90)
        print(f'Graph Statistics:')
        print(f'  Nodes: {len(G.nodes())}')
        print(f'  Edges: {len(G.edges())}')
        
        node_types = {}
        for n in G.nodes():
            t = G.nodes[n].get('type', 'unknown')
            node_types[t] = node_types.get(t, 0) + 1
        
        print(f'  Node Types:')
        for t, c in sorted(node_types.items()):
            print(f'    {t}: {c}')
        " > RELEASE_STATS.txt
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: RELEASE_STATS.txt
        body: |
          ## Family Health Graph Engine ${{ github.ref_name }}

          FastAPI service that models a household's daily health data as a
          knowledge graph and runs graph ML on it. Demo data is fully synthetic.

          See README.md for the quickstart and docs/ml-models.md for model details.
        generate_release_notes: true
        draft: false
        prerelease: false
